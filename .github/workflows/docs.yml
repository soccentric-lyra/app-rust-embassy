name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build base toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          tags: stm32-dev:latest
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=stm32-dev:latest
          tags: stm32-dev-rust:latest
          load: true
          cache-from: type=gha,scope=rust
          cache-to: type=gha,mode=max,scope=rust

      - name: Build documentation
        run: make docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/thumbv7em-none-eabihf/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
